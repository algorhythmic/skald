# DRAFT for 192.168.86.21 only. Review and install there yourself.
# The workstation exports only after an explicit Skald telemetry config change:
# otlp_metrics_endpoint: http://192.168.86.21:4318/v1/metrics
# Requires the contrib distribution (transform + prometheusremotewrite).
receivers:
  otlp/skald:
    protocols:
      http:
        endpoint: 192.168.86.21:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 192
    spike_limit_mib: 48
  # The Skald SDK supplies only these nonsecret resource attributes. Preserve
  # both before translating resources into series labels; drop future extras.
  transform/skald_identity:
    error_mode: propagate
    metric_statements:
      - keep_keys(resource.attributes, ["service.name", "service.instance.id"])
  batch:
    timeout: 5s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  prometheusremotewrite/skald:
    endpoint: http://127.0.0.1:9090/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    # Keep conventional _bytes, _seconds and _total names used by alert rules.
    add_metric_suffixes: true
    disable_scope_info: true
    remote_write_queue:
      enabled: true
      queue_size: 1000
      num_consumers: 1
    max_batch_request_parallelism: 1
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 60s

service:
  pipelines:
    metrics/skald:
      receivers: [otlp/skald]
      processors: [memory_limiter, transform/skald_identity, batch]
      exporters: [prometheusremotewrite/skald]
